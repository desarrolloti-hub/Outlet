<!-- ========================================
   ADMIN PANEL - OUTLET (ELEGANTE Y DORADO)
   ======================================== -->

<main class="admin-dashboard">

    <div class="admin-main-content">

        <header class="admin-page-header">
            <p class="admin-page-eyebrow">Administración</p>
            <h1 class="admin-page-title">Panel de Administración</h1>
        </header>

        <!-- ESTADÍSTICAS CON ICONOS DORADOS -->
        <section class="admin-cards">

            <div class="outlet-stat-card">
                <div class="outlet-stat-icon">
                    <i class="fa-solid fa-box"></i>
                </div>
                <div class="outlet-stat-info">
                    <h3 id="productsCount">8</h3>
                    <p>PRODUCTOS</p>
                </div>
            </div>

            <div class="outlet-stat-card">
                <div class="outlet-stat-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="outlet-stat-info">
                    <h3 id="usersCount">0</h3>
                    <p>USUARIOS</p>
                </div>
            </div>

            <div class="outlet-stat-card">
                <div class="outlet-stat-icon">
                    <i class="fa-solid fa-truck"></i>
                </div>
                <div class="outlet-stat-info">
                    <h3 id="ordersCount">0</h3>
                    <p>PEDIDOS</p>
                </div>
            </div>

            <!-- VENTAS SIN ICONO -->
            <div class="outlet-stat-card" id="salesCard">
                <div class="outlet-stat-info sales-only">
                    <h3 id="salesCount">$191,360</h3>
                    <p>VENTAS</p>
                </div>
            </div>

        </section>

        <!-- TABLA DE PRODUCTOS -->
        <section class="admin-table-section">

            <div class="admin-table-header">

                <h2 class="table-title">
                    <i class="fa-regular fa-star"></i>
                    Catálogo de Productos
                </h2>

                <button id="addProductBtn" class="admin-add-btn">
                    <i class="fa-solid fa-plus"></i>
                    Agregar producto
                </button>

            </div>

            <div class="admin-table-wrapper">

                <table class="admin-table">

                    <thead>
                        <tr>
                            <th class="text-center">IMAGEN</th>
                            <th class="text-center">PRODUCTO</th>
                            <th class="text-center">PRECIO</th>
                            <th class="text-center">CATEGORÍA</th>
                            <th class="text-center">ACCIONES</th>
                        </tr>
                    </thead>

                    <tbody id="productsTable">
                        <tr>
                            <td class="text-center"><img src="https://via.placeholder.com/50/DDAB3B/1F1B13?text=A"
                                    alt="producto" class="product-image"></td>
                            <td class="text-center"><strong>Aretes</strong></td>
                            <td class="text-center">$1,025</td>
                            <td class="text-center">Joyería</td>
                            <td class="text-center">
                                <div class="admin-actions-cell">
                                    <button class="admin-btn-edit" data-id="demo-1" title="Editar">
                                        <i class="material-symbols-outlined">edit</i>
                                        <span>Editar</span>
                                    </button>
                                    <button class="admin-btn-delete" data-id="demo-1" data-name="Aretes"
                                        title="Eliminar">
                                        <i class="material-symbols-outlined">delete</i>
                                        <span>Eliminar</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="text-center"><img src="https://via.placeholder.com/50/DDAB3B/1F1B13?text=K"
                                    alt="producto" class="product-image"></td>
                            <td class="text-center"><strong>Kids</strong></td>
                            <td class="text-center">$3,659</td>
                            <td class="text-center">Calzado</td>
                            <td class="text-center">
                                <div class="admin-actions-cell">
                                    <button class="admin-btn-edit" data-id="demo-2" title="Editar">
                                        <i class="material-symbols-outlined">edit</i>
                                        <span>Editar</span>
                                    </button>
                                    <button class="admin-btn-delete" data-id="demo-2" data-name="Kids" title="Eliminar">
                                        <i class="material-symbols-outlined">delete</i>
                                        <span>Eliminar</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="text-center"><img src="https://via.placeholder.com/50/DDAB3B/1F1B13?text=B"
                                    alt="producto" class="product-image"></td>
                            <td class="text-center"><strong>Bolso</strong></td>
                            <td class="text-center">$2,589</td>
                            <td class="text-center">Bolso</td>
                            <td class="text-center">
                                <div class="admin-actions-cell">
                                    <button class="admin-btn-edit" data-id="demo-3" title="Editar">
                                        <i class="material-symbols-outlined">edit</i>
                                        <span>Editar</span>
                                    </button>
                                    <button class="admin-btn-delete" data-id="demo-3" data-name="Bolso"
                                        title="Eliminar">
                                        <i class="material-symbols-outlined">delete</i>
                                        <span>Eliminar</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="text-center"><img src="https://via.placeholder.com/50/DDAB3B/1F1B13?text=C"
                                    alt="producto" class="product-image"></td>
                            <td class="text-center"><strong>Calzado</strong></td>
                            <td class="text-center">$5,236</td>
                            <td class="text-center">Calzado</td>
                            <td class="text-center">
                                <div class="admin-actions-cell">
                                    <button class="admin-btn-edit" data-id="demo-4" title="Editar">
                                        <i class="material-symbols-outlined">edit</i>
                                        <span>Editar</span>
                                    </button>
                                    <button class="admin-btn-delete" data-id="demo-4" data-name="Calzado"
                                        title="Eliminar">
                                        <i class="material-symbols-outlined">delete</i>
                                        <span>Eliminar</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </div>

</main>

<!-- ========================================
   MODAL PRODUCTO
   ======================================== -->

<div class="admin-modal" id="productModal" style="display:none;">

    <div class="admin-modal-content">

        <div class="admin-modal-header">

            <h3 id="modalTitle">
                <i class="fa-regular fa-gem"></i>
                Agregar Producto
            </h3>

            <button class="admin-modal-close" id="closeModalBtn">
                &times;
            </button>

        </div>

        <div class="admin-modal-body">

            <div class="admin-form-group">
                <label><i class="fa-regular fa-tag"></i> Nombre del producto</label>
                <input type="text" id="productName" placeholder="Ej: Aretes de oro">
            </div>

            <div class="admin-form-group">
                <label><i class="fa-regular fa-dollar-sign"></i> Precio (MXN)</label>
                <input type="number" id="productPrice" placeholder="0">
            </div>

            <div class="admin-form-group">
                <label><i class="fa-regular fa-layer-group"></i> Categoría</label>
                <input type="text" id="productCategory" placeholder="Ej: Joyería, Calzado, Bolso">
            </div>

            <div class="admin-form-group">
                <label><i class="fa-regular fa-image"></i> URL de imagen</label>
                <input type="text" id="productImage" placeholder="https://...">
            </div>

        </div>

        <div class="admin-modal-footer">

            <button class="admin-btn-cancel" id="cancelModalBtn">
                Cancelar
            </button>

            <button class="admin-btn-save" id="saveProductBtn">
                <i class="fa-regular fa-check"></i> Guardar
            </button>

        </div>

    </div>

</div>
